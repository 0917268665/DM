<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世興 DM 貼標神器</title>
    <!-- 引入 Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
        }
        /* Header 樣式 (與 index.html 完全一致) */
        .custom-header { background-color: #f37021; padding-top: 10px; padding-bottom: 15px; }
        .header-logo-container { width: 100%; text-align: center; margin-bottom: 10px; padding: 0 15px; }
        .header-logo { width: 100%; max-width: 400px; height: auto; object-fit: contain; }
        .header-title { font-size: 1.5rem; font-weight: bold; color: white; }
        .header-info { color: white; font-size: 0.9rem; line-height: 1.3; text-align: right; }

        /* Canvas 樣式 */
        canvas {
            background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), 
                              linear-gradient(-45deg, #ccc 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #ccc 75%), 
                              linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 100%;
            height: auto;
        }
        
        /* Modal 樣式微調 */
        .modal-header { border-bottom: none; }
        .dm-item { cursor: pointer; transition: transform 0.2s; }
        .dm-item:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        /* 滑動條容器 */
        .slider-row { display: flex; align-items: center; margin-bottom: 10px; }
        .slider-label { min-width: 80px; font-size: 0.9rem; color: #4b5563; }
        
        /* 載入動畫 */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Header Section (完全複製 index.html) -->
    <header class="custom-header shadow-sm mb-3">
        <div class="header-logo-container">
            <!-- Logo 路徑記得確認 -->
            <img src="../logo.png" alt="新魅力旅遊 Logo" class="header-logo" onerror="this.style.display='none'">
        </div>
        
        <div class="container">
            <div class="d-flex justify-content-between align-items-end mb-2">
                <div class="header-title">
                    <!-- 修改：移除 DM 兩側的空格，改為 "📸 世興DM貼標神器" -->
                    📸 世興DM貼標神器
                </div>
                
                <div class="header-info d-flex align-items-center">
                    <div class="me-2">
                <div>業務：蔡雅筑</div>
                <div>手機：0920277072</div>
                </div>
                <a href="https://line.me/ti/p/peLdih_4DD" target="_blank">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg" alt="LINE" height="36">
                    </a>
                </div>
            </div>
    
            <div class="d-flex gap-2 mt-3">
                <a href="https://0917268665.github.io/DM/lisa/content.html" target="_blank" class="btn btn-light text-danger fw-bold w-50 shadow-sm" style="border-radius: 50px;">
                    📝 點我前往文案小幫手
                </a>
                <a href="https://0917268665.github.io/DM/lisa/" class="btn btn-light text-primary fw-bold w-50 shadow-sm" style="border-radius: 50px;">
                    🏠 回行程下載
                </a>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container pb-5">
        <div class="text-center mb-4 text-muted">
            <small>簡單三步驟：選取行程 DM &rarr; 上傳您的底標 &rarr; 調整位置並下載</small>
        </div>

        <div class="row g-4">
            <!-- Controls Section (Left) -->
            <div class="col-md-4">
                <div class="bg-white p-4 rounded shadow-sm">
                    <!-- Step 1 -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">1. 選擇行程 DM</label>
                        <button onclick="toggleLibrary()" class="btn btn-outline-primary w-100 py-2">
                            📂 從 DM 圖庫選取
                        </button>
                    </div>

                    <!-- Step 2 -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">2. 上傳您的底標</label>
                        <input class="form-control" type="file" id="footerInput" accept="image/*">
                        <div class="form-text">支援 PNG 透明背景圖檔效果最佳</div>
                    </div>

                    <hr>

                    <!-- Step 3 Controls -->
                    <div id="controlsArea" class="opacity-50 pe-none user-select-none transition">
                        <h6 class="fw-bold mb-3">3. 調整底標位置</h6>
                        
                        <div class="slider-row">
                            <span class="slider-label">上下位置</span>
                            <input type="range" class="form-range" id="yPos" min="-500" max="500" value="0">
                        </div>
                        
                        <div class="slider-row">
                            <span class="slider-label">左右位置</span>
                            <input type="range" class="form-range" id="xPos" min="-500" max="500" value="0">
                        </div>

                        <div class="slider-row">
                            <span class="slider-label">縮放大小</span>
                            <input type="range" class="form-range" id="scale" min="10" max="200" value="100">
                        </div>

                        <div class="d-flex gap-2 mt-3">
                            <button onclick="fitToWidth()" class="btn btn-light flex-fill border">填滿寬度</button>
                            <button onclick="resetFooter()" class="btn btn-light flex-fill border">重置位置</button>
                        </div>
                    </div>

                    <!-- Download Button -->
                    <button onclick="downloadImage()" id="downloadBtn" class="btn btn-primary w-100 mt-4 py-2 fw-bold" disabled>
                        📥 下載完成圖
                    </button>

                    <div class="alert alert-warning mt-3 mb-0 py-2 small">
                        <strong>提示：</strong> 您也可以直接在右側預覽圖上「拖曳」底標來移動位置。
                    </div>
                </div>
            </div>

            <!-- Preview Section (Right) -->
            <div class="col-md-8">
                <div class="bg-white p-4 rounded shadow-sm border border-dashed d-flex align-items-center justify-content-center" style="min-height: 500px;" id="canvasWrapper">
                    <p id="placeholderText" class="text-muted text-center pointer-events-none">
                        預覽區域<br><small>請從圖庫選擇圖片</small>
                    </p>
                    <canvas id="canvas" class="d-none"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- DM Library Modal (Bootstrap 5) -->
    <div class="modal fade" id="libraryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">選擇行程 DM</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body bg-light">
                    <!-- Loading State -->
                    <div id="libraryLoading" class="text-center text-muted mt-4">
                        <div class="loader"></div>
                        <p class="mt-2">正在讀取 DM 列表...</p>
                    </div>
                    
                    <div id="libraryGrid" class="row g-3 d-none">
                        <!-- Javascript will inject items here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入 Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript Logic -->
    <script>
        // --- 設定：Google Sheet CSV 連結 ---
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcPCobeix2WBU69fxSbx9IKFJpPtP04dutrcHp-KV8L1vnAEcUErx-x0zfGbBBYaUWtzgR-ZZR6W6B/pub?output=csv";

        // 資料變數
        let dmLibrary = []; 
        let isLibraryLoaded = false;
        let bsModal = null; // Bootstrap Modal Instance

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const footerInput = document.getElementById('footerInput');
        const controlsArea = document.getElementById('controlsArea');
        const downloadBtn = document.getElementById('downloadBtn');
        const placeholderText = document.getElementById('placeholderText');
        const libraryGrid = document.getElementById('libraryGrid');
        const libraryLoading = document.getElementById('libraryLoading');
        
        // Sliders
        const ySlider = document.getElementById('yPos');
        const xSlider = document.getElementById('xPos');
        const sSlider = document.getElementById('scale');

        // State
        let dmImg = new Image();
        let footerImg = new Image();
        let currentDmName = "行程DM"; 
        let footerState = {
            x: 0, y: 0, width: 0, height: 0, scale: 1,
            originalWidth: 0, originalHeight: 0
        };
        let isDragging = false;
        let lastMouseX, lastMouseY;

        // --- Init ---
        document.addEventListener('DOMContentLoaded', function() {
            bsModal = new bootstrap.Modal(document.getElementById('libraryModal'));
        });

        // --- Event Listeners ---

        footerInput.addEventListener('change', (e) => loadFile(e.target.files[0], 'footer'));

        [ySlider, xSlider, sSlider].forEach(el => {
            el.addEventListener('input', updateStateFromSliders);
        });

        canvas.addEventListener('mousedown', startDrag);
        canvas.addEventListener('mousemove', drag);
        window.addEventListener('mouseup', endDrag);
        
        // Touch events
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousedown', {
                clientX: touch.clientX, clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent('mousemove', {
                clientX: touch.clientX, clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        }, {passive: false});

        canvas.addEventListener('touchend', () => window.dispatchEvent(new MouseEvent('mouseup')));

        // --- Library Logic ---

        function toggleLibrary() {
            bsModal.show();
            if (!isLibraryLoaded) {
                loadLibraryFromSheet();
            }
        }

        async function loadLibraryFromSheet() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                const csvText = await response.text();
                
                dmLibrary = parseCSVAndMap(csvText);
                isLibraryLoaded = true;
                
                renderLibrary();
                
            } catch (error) {
                console.error("Error loading sheet:", error);
                libraryLoading.innerHTML = `<p class="text-danger">載入失敗，請確認網路。</p>`;
            }
        }

        function parseCSVAndMap(text) {
            const rows = text.split(/\r?\n/).map(row => {
                const regex = /(".*?"|[^",\s]+)(?=\s*,|\s*$)/g;
                return row.split(','); 
            }).filter(row => row.length > 1);

            if (rows.length === 0) return [];

            const headers = rows[0].map(h => h.trim().toLowerCase());
            const dataRows = rows.slice(1);

            let titleIdx = headers.findIndex(h => h.includes('title') || h.includes('名稱') || h.includes('標題'));
            let urlIdx = headers.findIndex(h => h.includes('url') || h.includes('link') || h.includes('img') || h.includes('圖片') || h.includes('連結'));

            if (titleIdx === -1) titleIdx = 0;
            if (urlIdx === -1) urlIdx = 1;

            return dataRows.map(cols => {
                const clean = (str) => str ? str.replace(/^"|"$/g, '').trim() : '';
                return {
                    name: clean(cols[titleIdx]),
                    url: clean(cols[urlIdx])
                };
            }).filter(item => item.url && item.url.length > 5);
        }

        function renderLibrary() {
            libraryLoading.classList.add('d-none');
            libraryGrid.classList.remove('d-none');

            if (dmLibrary.length === 0) {
                libraryGrid.innerHTML = '<p class="text-center text-muted">沒有找到 DM 資料</p>';
                return;
            }

            libraryGrid.innerHTML = dmLibrary.map(dm => {
                const thumbnailUrl = dm.url.replace(/(\.[^./?]+)(\?.*)?$/, '_m$1$2');
                const safeName = dm.name.replace(/'/g, "\\'");

                return `
                <div class="col-6 col-md-4">
                    <div class="card h-100 dm-item" onclick="selectDmFromLibrary('${dm.url}', '${safeName}')">
                        <div class="card-img-top bg-light d-flex align-items-center justify-content-center overflow-hidden" style="height: 180px;">
                            <img src="${thumbnailUrl}" 
                                 onerror="this.onerror=null;this.src='${dm.url}';"
                                 alt="${dm.name}" 
                                 class="w-100 h-100 object-fit-cover" 
                                 loading="lazy">
                        </div>
                        <div class="card-body p-2 text-center">
                            <small class="fw-bold text-dark text-truncate d-block" title="${dm.name}">${dm.name}</small>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }

        function selectDmFromLibrary(url, name) {
            if(name) {
                currentDmName = name;
            } else {
                currentDmName = "行程DM";
            }
            bsModal.hide(); // Close modal
            loadFromUrl(url);
        }

        function loadFromUrl(url) {
            const img = new Image();
            img.crossOrigin = "Anonymous"; 
            
            placeholderText.innerHTML = `
                <div class="loader"></div>
                <p>圖片載入中...</p>
            `;
            canvas.classList.add('d-none');

            img.onload = () => {
                dmImg = img;
                initCanvas();
                draw();
                checkReady();
            };
            
            img.onerror = () => {
                alert("無法載入圖片，請重試。");
                placeholderText.innerHTML = "圖片載入失敗";
            };
            
            img.src = url + (url.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
        }

        // --- Core Functions ---

        function loadFile(file, type) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    if (type === 'dm') {
                        dmImg = img;
                        initCanvas();
                    } else {
                        footerImg = img;
                        initFooter();
                    }
                    draw();
                    checkReady();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function initCanvas() {
            canvas.width = dmImg.width;
            canvas.height = dmImg.height;
            canvas.classList.remove('d-none');
            placeholderText.classList.add('d-none');
            if (footerImg.src) resetFooter();
        }

        function initFooter() {
            footerState.originalWidth = footerImg.width;
            footerState.originalHeight = footerImg.height;
            resetFooter();
            // Enable controls
            controlsArea.classList.remove('opacity-50', 'pe-none');
        }

        function resetFooter() {
            if (!dmImg.src || !footerImg.src) return;
            const scale = canvas.width / footerImg.width;
            footerState.width = canvas.width;
            footerState.height = footerImg.height * scale;
            footerState.x = 0;
            footerState.y = canvas.height - footerState.height;
            footerState.scale = 100;
            ySlider.value = 0;
            xSlider.value = 0;
            sSlider.value = 100;
            draw();
        }
        
        function fitToWidth() { resetFooter(); }

        function updateStateFromSliders() {
            if (!dmImg.src || !footerImg.src) return;
            const baseScale = canvas.width / footerState.originalWidth;
            const currentScale = sSlider.value / 100;
            footerState.width = footerState.originalWidth * baseScale * currentScale;
            footerState.height = footerState.originalHeight * baseScale * currentScale;
            
            const baseX = (canvas.width - footerState.width) / 2;
            const baseY = canvas.height - footerState.height;
            const moveFactor = canvas.height / 500; 
            
            footerState.x = baseX + (parseInt(xSlider.value) * moveFactor);
            footerState.y = baseY + (parseInt(ySlider.value) * moveFactor * -1);
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (dmImg.src) ctx.drawImage(dmImg, 0, 0);
            if (footerImg.src) {
                ctx.drawImage(footerImg, footerState.x, footerState.y, footerState.width, footerState.height);
                ctx.strokeStyle = "rgba(37, 99, 235, 0.8)";
                ctx.lineWidth = 4;
                ctx.setLineDash([10, 5]);
                ctx.strokeRect(footerState.x, footerState.y, footerState.width, footerState.height);
                ctx.setLineDash([]);
            }
        }
        
        function downloadImage() {
            if (dmImg.src) ctx.drawImage(dmImg, 0, 0);
            if (footerImg.src) ctx.drawImage(footerImg, footerState.x, footerState.y, footerState.width, footerState.height);
            
            const link = document.createElement('a');
            link.download = currentDmName + '已加底標.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
            draw();
        }

        function checkReady() {
            if (dmImg.src && footerImg.src) downloadBtn.disabled = false;
        }

        // --- Drag Logic ---
        function startDrag(e) {
            if (!footerImg.src) return;
            const rect = canvas.getBoundingClientRect();
            // Need to account for Bootstrap layout causing canvas scaling
            // Ideally canvas is max-width: 100%, so we calculate ratio
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            if (mouseX >= footerState.x && mouseX <= footerState.x + footerState.width &&
                mouseY >= footerState.y && mouseY <= footerState.y + footerState.height) {
                isDragging = true;
                lastMouseX = mouseX;
                lastMouseY = mouseY;
            }
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            
            footerState.x += (mouseX - lastMouseX);
            footerState.y += (mouseY - lastMouseY);
            lastMouseX = mouseX;
            lastMouseY = mouseY;
            draw();
        }

        function endDrag() { isDragging = false; }

    </script>
</body>
</html>
