<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>精選DM、行程下載</title>
    
    <meta property="og:title" content="DM、行程下載專區">
    <meta property="og:description" content="提供最新旅遊行程DM、行程表下載。">
    <meta property="og:image" content="">
    <meta property="og:url" content="https://0917268665.github.io/DM/go/">
    <meta property="og:type" content="website">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: "Microsoft JhengHei", sans-serif; }
        /* 將背景色改為 Logo 的綠色 */
        .custom-header { background-color: #8d6eb0; padding-top: 10px; padding-bottom: 15px; }
        .header-logo-container { width: 100%; text-align: center; margin-bottom: 10px; padding: 0 15px; }
        .header-logo { width: 100%; max-width: 400px; height: auto; object-fit: contain; }
        .header-title { font-size: 1.5rem; font-weight: bold; color: white; }
        
        .tour-card { cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; background: white; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .tour-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .dm-container { width: 100%; aspect-ratio: 210 / 297; background-color: #f8f9fa; position: relative; border-bottom: 1px solid #eee; }
        .dm-img { width: 100%; height: 100%; object-fit: contain; }
        
        /* 分類按鈕滑動區塊樣式 */
        .category-scroll-container {
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px 5px;
            -webkit-overflow-scrolling: touch; /* 讓手機滑動更順暢 */
            scrollbar-width: none; /* Firefox 隱藏捲軸 */
        }
        .category-scroll-container::-webkit-scrollbar { display: none; /* Chrome 隱藏捲軸 */ }
        
        /* 將按鈕顏色改為 Logo 的綠色 */
        .cat-btn {
            display: inline-block;
            margin-right: 8px;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 0.95rem;
            border: 1px solid #6eb071;
            background-color: white;
            color: #8d6eb0;
            transition: all 0.3s;
        }
        .cat-btn.active, .cat-btn:hover {
            background-color: #8d6eb0;
            color: white;
        }

        .modal-header { background: #2c3e50; color: white; }
        .commission-box { display: none; background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; margin-top: 10px; }
        .warning-modal-header { background-color: #dc3545; color: white; }
    </style>
</head>
<body>

<header class="custom-header shadow-sm mb-3">
    <div class="header-logo-container">
        <img src="" alt="Logo" class="header-logo">
    </div>
    
    <div class="container">
        <div class="d-flex justify-content-center align-items-center mb-2">
            <div class="header-title">
                ✈️ 精選DM行程下載
            </div>
        </div>
        </div>
</header>

<div class="container sticky-top bg-white shadow-sm py-2 mb-4" style="z-index: 100; border-radius: 0 0 15px 15px;">
    <div class="category-scroll-container" id="category-container">
        <button class="btn cat-btn active" onclick="filterCategory('all', this)">全部</button>
        <button class="btn cat-btn" onclick="filterCategory('日本', this)">日本</button>
        <button class="btn cat-btn" onclick="filterCategory('韓國', this)">韓國</button>
        <button class="btn cat-btn" onclick="filterCategory('中國大陸', this)">中國大陸</button>
        <button class="btn cat-btn" onclick="filterCategory('泰國', this)">泰國</button>
        <button class="btn cat-btn" onclick="filterCategory('越南', this)">越南</button>
        <button class="btn cat-btn" onclick="filterCategory('馬來西亞', this)">馬來西亞</button>
        <button class="btn cat-btn" onclick="filterCategory('菲律賓', this)">菲律賓</button>
        <button class="btn cat-btn" onclick="filterCategory('印尼', this)">印尼</button>
        <button class="btn cat-btn" onclick="filterCategory('新加坡', this)">新加坡</button>
        <button class="btn cat-btn" onclick="filterCategory('汶萊', this)">汶萊</button>
        <button class="btn cat-btn" onclick="filterCategory('港澳', this)">港澳</button>
        <button class="btn cat-btn" onclick="filterCategory('歐洲', this)">歐洲</button>
        <button class="btn cat-btn" onclick="filterCategory('紐澳', this)">紐澳</button>
        <button class="btn cat-btn" onclick="filterCategory('中東.中亞.非洲', this)">中東.中亞.非洲</button>
    </div>
</div>

<div class="container mb-5">
    <div class="row g-4" id="tour-list">
        </div>
</div>

<div class="modal fade" id="warningModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header warning-modal-header">
                <h5 class="modal-title fw-bold">⚠️ 網站使用聲明</h5>
            </div>
            <div class="modal-body fs-6">
                <p>感謝您使用本網站，本網站內容已盡力維持資訊正確性，但因價格波動快速，請依業務回覆為準，謝謝！</p>
                </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-primary w-50" data-bs-dismiss="modal">好，我了解</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="m-title">行程名稱</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <small class="text-muted">行程編號</small>
                        <div class="fw-bold fs-5 text-primary" id="m-id">--</div>
                    </div>
                    <div class="col-md-8 mt-2 mt-md-0">
                        <div class="d-flex justify-content-md-end gap-2 flex-wrap">
                            <a id="m-doc" href="#" class="btn btn-outline-primary shadow-sm">
                                📥 下載行程表
                            </a>
                            <a id="m-dm-download" href="#" target="_blank" class="btn btn-outline-danger shadow-sm">
                                📥 下載 DM
                            </a>
                        </div>
                    </div>
                </div>

                <div class="alert alert-secondary" role="alert">
                    <strong>📝 備註：</strong> <span id="m-remark">無</span>
                </div>
                
                <hr>

                <h5 class="mt-3">📄 DM 預覽</h5>
                <div class="text-center mb-3 p-2 bg-light border">
                    <img id="m-preview-img" src="" class="img-fluid" style="max-height: 400px;" alt="DM預覽">
                </div>

                <h5 class="mt-4 mb-3 border-start border-4 border-primary ps-2">📅 出發日與售價</h5>
                <div class="alert alert-success text-center fw-bold fs-5" role="alert">
                    詳細日期與價格請洽詢業務人員
                </div>
                <div class="mb-4"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">關閉</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // 設定區
    const googleSheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcPCobeix2WBU69fxSbx9IKFJpPtP04dutrcHp-KV8L1vnAEcUErx-x0zfGbBBYaUWtzgR-ZZR6W6B/pub?output=csv";

    // 輔助函式：連結處理
    function convertToDirectLink(url, isImage = false) {
        if (!url) return "#";
        if (url.startsWith("http") && url.includes("drive.google.com")) {
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return isImage 
                    ? `https://drive.google.com/uc?export=view&id=${match[1]}`
                    : `https://docs.google.com/uc?export=download&id=${match[1]}`;
            }
        }
        return url; 
    }

    // 強制轉換函式 (_m 縮圖)
    function getResizedPath(originalPath, size) {
        if (!originalPath || originalPath.startsWith("http")) return convertToDirectLink(originalPath, true);
        if (size === 'original') return originalPath;
        if (originalPath.toLowerCase().endsWith(".jpg")) {
            return originalPath.replace(/.jpg$/i, "_m.jpg");
        }
        if (originalPath.toLowerCase().endsWith(".png")) {
            return originalPath.replace(/.png$/i, "_m.png");
        }
        return originalPath;
    }

    const tourList = document.getElementById('tour-list');
    const modal = new bootstrap.Modal(document.getElementById('detailModal'));
    const warningModal = new bootstrap.Modal(document.getElementById('warningModal'));
    
    // 定義全域變數
    let ALL_TOURS = []; // 存放所有資料
    let DISPLAY_TOURS = []; // 存放目前要顯示的資料 (篩選後)

    document.addEventListener("DOMContentLoaded", function() {
        warningModal.show();
        fetchData();
    });

    // 改用 fetch() 先抓取資料，再交給 PapaParse 解析
    function fetchData() {
        fetch(googleSheetUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error("網路回應不正常");
                }
                return response.text();
            })
            .then(csvText => {
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true, // 自動跳過空行
                    complete: function(results) {
                        // 讀取資料並過濾無效列
                        ALL_TOURS = results.data.filter(item => item.id && item.title);
                        // 一開始預設顯示全部
                        DISPLAY_TOURS = ALL_TOURS;
                        renderTours();
                    },
                    error: function(err) {
                         console.error("CSV 解析錯誤:", err);
                         tourList.innerHTML = `<div class="alert alert-danger">無法解析行程資料，請稍後再試。</div>`;
                    }
                });
            })
            .catch(error => {
                console.error("讀取 Excel 失敗:", error);
                tourList.innerHTML = `<div class="alert alert-danger">無法讀取行程資料，請檢查網路或連結。</div>`;
            });
    }

    // ★ 新增功能：分類篩選邏輯
    function filterCategory(category, btnElement) {
        // 1. 處理按鈕樣式 (Active)
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        // 2. 篩選資料
        if (category === 'all') {
            DISPLAY_TOURS = ALL_TOURS;
        } else {
            // 檢查 Excel 中的 category 欄位是否包含該分類文字
            DISPLAY_TOURS = ALL_TOURS.filter(tour => {
                return tour.category && tour.category.includes(category);
            });
        }

        // 3. 重新渲染列表
        renderTours();
    }

    function renderTours() {
        tourList.innerHTML = "";

        if (DISPLAY_TOURS.length === 0) {
            tourList.innerHTML = `<div class="col-12 text-center text-muted py-5">此分類暫無行程</div>`;
            return;
        }

        DISPLAY_TOURS.forEach((tour) => {
            const originalIndex = ALL_TOURS.indexOf(tour);
            const thumbSrc = getResizedPath(tour.img, 'thumb');
            const col = document.createElement('div');
            col.className = 'col-lg-3 col-md-4 col-sm-6'; 
            
            col.innerHTML = `
                <div class="tour-card h-100" onclick="openTour(${originalIndex})">
                    <div class="dm-container">
                        <img src="${thumbSrc}" class="dm-img" alt="${tour.title}">
                    </div>
                    <div class="card-body p-3 d-flex flex-column">
                        <div class="d-flex justify-content-between">
                            <h6 class="text-secondary mb-1 small">${tour.id}</h6>
                            <small class="text-white bg-secondary px-2 rounded-pill" style="font-size: 0.7rem; height:fit-content;">${tour.category || '精選'}</small>
                        </div>
                        <h6 class="card-title fw-bold mb-2 text-truncate">${tour.title}</h6>
                        <small class="text-muted d-block text-truncate mb-3">${tour.remark}</small>
                        <div class="mt-auto">
                            <button class="btn btn-primary w-100 shadow-sm">查看詳情</button>
                        </div>
                    </div>
                </div>
            `;
            tourList.appendChild(col);
        });
    }

    let currentTour = null;

    function openTour(index) {
        currentTour = ALL_TOURS[index];
        
        document.getElementById('m-title').innerText = currentTour.title;
        document.getElementById('m-id').innerText = currentTour.id;
        document.getElementById('m-remark').innerText = currentTour.remark;

        const previewSrc = getResizedPath(currentTour.img, 'preview');
        const previewImg = document.getElementById('m-preview-img');
        previewImg.src = previewSrc;
        // 確保預覽圖若讀取失敗，會顯示原圖
        previewImg.onerror = function() {
            this.onerror = null; // 防止無窮迴圈
            this.src = currentTour.img;
        };
        
        const originalSrc = getResizedPath(currentTour.img, 'original');
        const dmBtn = document.getElementById('m-dm-download');
        dmBtn.href = originalSrc;
        dmBtn.setAttribute("target", "_blank");

        const docBtn = document.getElementById('m-doc');
        
        // 自動將路徑中的 .doc 或 .docx 替換成 .pdf (不分大小寫)
        let pdfLink = currentTour.doc_link || "#";
        pdfLink = pdfLink.replace(/\.docx?$/i, '.pdf');

        docBtn.href = convertToDirectLink(pdfLink, false);
        docBtn.setAttribute("target", "_blank");
        if(pdfLink.startsWith("./") || pdfLink.startsWith("../")) {
             docBtn.setAttribute("download", ""); 
        }
          
        // 已移除原本動態產生官網連結的程式碼
        
        modal.show();
    }
    </script>
</body>
</html>
