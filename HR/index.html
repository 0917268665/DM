<body class="min-h-screen selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <!-- Main Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Helper to get dynamic greeting based on current hour ---
    function getGreeting(date) {
      const hour = date.getHours();
      if (hour >= 5 && hour < 12) return '早安 ☀️';
      if (hour >= 12 && hour < 14) return '午安 🌤️';
      if (hour >= 14 && hour < 18) return '下午好 🌇';
      return '晚上好 🌙';
    }

    // --- Helper to clean & format Date to YYYY-MM-DD ---
    function cleanDateString(val) {
      if (!val) return '';
      const str = String(val);
      const match = str.match(/(\d{4}-\d{2}-\d{2})/);
      if (match) return match[1];
      try {
        const d = new Date(str);
        if (!isNaN(d.getTime())) {
          return d.toISOString().split('T')[0];
        }
      } catch (e) {}
      return str.split('T')[0];
    }

    // --- Helper to clean & format Time to HH:mm:ss (No 1899 Year or Timezones!) ---
    function cleanTimeString(val) {
      if (!val || val === '--:--:--') return '--:--:--';
      const str = String(val);
      
      const timeMatch = str.match(/(\d{2}:\d{2}:\d{2})/);
      if (timeMatch) return timeMatch[1];

      const shortMatch = str.match(/(\d{2}:\d{2})/);
      if (shortMatch) return shortMatch[1];

      return str;
    }

    // --- Haversine Formula for GPS Distance Calculation (Meters) ---
    function calculateGpsDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return Math.round(R * c);
    }

    // --- Calculate Late Minutes Based on Employee Shift Start Time ---
    function calculateLateMinutes(shiftStr, clockInDate) {
      let shiftStartHour = 9;
      let shiftStartMin = 0;

      if (shiftStr && shiftStr.includes('-')) {
        const startTimePart = shiftStr.split('-')[0].trim();
        const [h, m] = startTimePart.split(':').map(Number);
        if (!isNaN(h)) shiftStartHour = h;
        if (!isNaN(m)) shiftStartMin = m;
      }

      const shiftTotalMins = shiftStartHour * 60 + shiftStartMin;
      const actualTotalMins = clockInDate.getHours() * 60 + clockInDate.getMinutes();

      const diff = actualTotalMins - shiftTotalMins;
      return diff > 0 ? diff : 0;
    }

    const INITIAL_EMPLOYEES = [
      { id: 'EMP001', username: 'emp01', pass: '123456', name: '張小明', role: '前端開發工程師', dept: '技術研發部', avatar: '👨‍💻', shift: '09:00 - 18:00', isAdmin: false, annualLeave: 10, sickLeave: 30, compLeave: 0 },
      { id: 'EMP002', username: 'admin', pass: 'admin888', name: '李梅', role: 'HR 人資主管', dept: '人力資源部', avatar: '👩‍💼', shift: '09:00 - 18:00', isAdmin: true, annualLeave: 14, sickLeave: 30, compLeave: 8 },
      { id: 'EMP003', username: 'emp03', pass: '123456', name: '王大同', role: '資深產品經理', dept: '產品設計部', avatar: '👨‍💼', shift: '09:30 - 18:30', isAdmin: false, annualLeave: 12, sickLeave: 30, compLeave: 12.5 }
    ];

    const INITIAL_LOGS = [];
    const INITIAL_LEAVES = [];

    // --- Main App Component ---
    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        const savedUser = localStorage.getItem('hr_current_user');
        return savedUser ? JSON.parse(savedUser) : null;
      });
      const [loginAccount, setLoginAccount] = useState('');
      const [loginPass, setLoginPass] = useState('');

      // Location & WiFi Restrictions
      const [punchConfig, setPunchConfig] = useState(() => {
        const savedConfig = localStorage.getItem('hr_punch_config');
        return savedConfig ? JSON.parse(savedConfig) : {
          enableWifiRestriction: false,
          wifiName: 'Office_Corporate_5G',
          enableGpsRestriction: false,
          centerLat: 25.0330,
          centerLng: 121.5654,
          allowedRadiusMeters: 300,
          restrictionLogic: 'AND'
        };
      });

      // Google Apps Script Sync Settings (預設預置 URL 以利 GitHub Pages 部署後初次造訪自動雙向同步)
      const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbzckTfS6df7qmR9bcjdyiqQguYFO7GkxjdQwH5Co4kjPisVYNDNpGcfinKK-_HQNV5X/exec';
      const [gasUrl, setGasUrl] = useState(() => localStorage.getItem('hr_gas_url') || DEFAULT_GAS_URL);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [syncingGas, setSyncingGas] = useState(false);

      // Employees & Data Persistence
      const [employees, setEmployees] = useState(() => {
        const saved = localStorage.getItem('hr_employees');
        return saved ? JSON.parse(saved) : INITIAL_EMPLOYEES;
      });
      const [logs, setLogs] = useState(() => {
        const saved = localStorage.getItem('hr_logs');
        return saved ? JSON.parse(saved) : INITIAL_LOGS;
      });
      const [leaves, setLeaves] = useState(() => {
        const saved = localStorage.getItem('hr_leaves');
        return saved ? JSON.parse(saved) : INITIAL_LEAVES;
      });

      const [activeTab, setActiveTab] = useState('clock');
      const [currentTime, setCurrentTime] = useState(new Date());
      const [punchNote, setPunchNote] = useState('');
      const [toast, setToast] = useState(null);

      // Report Filtering States
      const [reportType, setReportType] = useState('monthly');
      const [filterYear, setFilterYear] = useState('2026');
      const [filterMonth, setFilterMonth] = useState('08');

      // Modals
      const [showLeaveModal, setShowLeaveModal] = useState(false);
      const [showEmpEditModal, setShowEmpEditModal] = useState(false);
      const [editingEmp, setEditingEmp] = useState(null);

      // Save States to LocalStorage
      useEffect(() => {
        localStorage.setItem('hr_punch_config', JSON.stringify(punchConfig));
      }, [punchConfig]);

      useEffect(() => {
        localStorage.setItem('hr_employees', JSON.stringify(employees));
      }, [employees]);

      useEffect(() => {
        localStorage.setItem('hr_logs', JSON.stringify(logs));
      }, [logs]);

      useEffect(() => {
        localStorage.setItem('hr_leaves', JSON.stringify(leaves));
      }, [leaves]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('hr_current_user', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('hr_current_user');
        }
      }, [currentUser]);

      useEffect(() => {
        localStorage.setItem('hr_gas_url', gasUrl);
      }, [gasUrl]);

      // Clock Timer
      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Trigger Lucide Icon Render
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4500);
      };

      // --- BI-DIRECTIONAL SYNC & CLEAN FORMATTING ---
      const fetchFromSheet = async () => {
        if (!gasUrl) return;
        setSyncingGas(true);
        try {
          const res = await fetch(gasUrl);
          const data = await res.json();
          if (data.status === 'success') {
            if (Array.isArray(data.employees) && data.employees.length > 0) {
              setEmployees(data.employees);
            }
            if (Array.isArray(data.logs)) {
              // Format & Clean raw log dates and times
              const cleanedLogs = data.logs.map(l => ({
                ...l,
                date: cleanDateString(l.date),
                checkIn: cleanTimeString(l.checkIn),
                checkOut: cleanTimeString(l.checkOut)
              }));
              setLogs(cleanedLogs);
            }
            showToast('📊 已成功從 Google 試算表雙向同步最新考勤紀錄！');
          }
        } catch (err) {
          console.warn('Google Sheet GET Sync warning:', err);
        } finally {
          setSyncingGas(false);
        }
      };

      useEffect(() => {
        if (gasUrl) {
          fetchFromSheet();
        }
      }, [gasUrl]);

      const handleLogin = (e) => {
        e.preventDefault();
        const found = employees.find(emp => emp.username === loginAccount && emp.pass === loginPass);
        
        if (!found) {
          showToast('❌ 帳號或密碼錯誤，請重新確認！', 'warning');
          return;
        }

        setCurrentUser(found);
        setActiveTab(found.isAdmin ? 'admin' : 'clock');
        showToast(`🎉 歡迎登入，${found.name} (${found.isAdmin ? '主管權限' : '一般員工'})！`);
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setLoginAccount('');
        setLoginPass('');
        showToast('👋 您已成功登出系統！');
      };

      const todayStr = currentTime.toISOString().split('T')[0];
      const todayLog = useMemo(() => {
        if (!currentUser) return null;
        return logs.find(l => l.empId === currentUser.id && l.date === todayStr);
      }, [logs, currentUser, todayStr]);

      const handleSaveEmployee = async (empData) => {
        let updatedList = [];
        const exists = employees.some(e => e.id === empData.id);

        if (exists) {
          updatedList = employees.map(e => e.id === empData.id ? { ...e, ...empData } : e);
        } else {
          updatedList = [...employees, empData];
        }

        setEmployees(updatedList);

        if (currentUser && currentUser.id === empData.id) {
          setCurrentUser(prev => ({ ...prev, ...empData }));
        }

        setShowEmpEditModal(false);
        setEditingEmp(null);
        showToast(`✅ 員工【${empData.name}】資料與班次(${empData.shift})已儲存！`);

        if (gasUrl) {
          try {
            await fetch(gasUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'saveEmployee', employee: empData })
            });
            showToast('📊 員工與班次資料已同步寫入 Google 試算表！');
          } catch (err) {
            console.error('GAS Save Employee Error:', err);
          }
        }
      };

      const syncToGoogleSheet = async (logData) => {
        if (!gasUrl) return;
        setSyncingGas(true);
        try {
          const payload = {
            ...logData,
            empName: currentUser.name,
            dept: currentUser.dept
          };

          await fetch(gasUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          showToast('📊 打卡資料已自動同步寫入 Google 試算表！');
        } catch (err) {
          console.error('GAS Sync Error:', err);
          showToast('⚠️ Google 試算表同步連線異常，已先保存在本地庫。', 'warning');
        } finally {
          setSyncingGas(false);
        }
      };

      // RESTRICTION VALIDATION
      const validatePunchRestrictions = async () => {
        const isWifiOn = punchConfig.enableWifiRestriction;
        const isGpsOn = punchConfig.enableGpsRestriction;

        if (!isWifiOn && !isGpsOn) return true;

        let wifiPassed = false;
        let gpsPassed = false;

        if (isWifiOn) {
          if (navigator.connection && navigator.connection.type === 'cellular') {
            wifiPassed = false;
          } else {
            wifiPassed = true;
          }
        }

        if (isGpsOn) {
          gpsPassed = await new Promise((resolve) => {
            if (!navigator.geolocation) {
              resolve(false);
              return;
            }
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                const distance = calculateGpsDistance(
                  pos.coords.latitude, pos.coords.longitude,
                  punchConfig.centerLat, punchConfig.centerLng
                );
                resolve(distance <= punchConfig.allowedRadiusMeters);
              },
              () => resolve(false),
              { timeout: 8000 }
            );
          });
        }

        const mode = punchConfig.restrictionLogic || 'AND';

        if (isWifiOn && isGpsOn) {
          if (mode === 'AND') {
            if (!wifiPassed || !gpsPassed) {
              showToast('⚠️ 打卡失敗：目前設定為【需同時滿足 WiFi 與 GPS 兩者限制】！', 'warning');
              return false;
            }
            return true;
          } else if (mode === 'OR') {
            if (!wifiPassed && !gpsPassed) {
              showToast('⚠️ 打卡失敗：WiFi 與 GPS 定位皆未符合公司允許範圍！', 'warning');
              return false;
            }
            return true;
          }
        }

        if (isWifiOn && !wifiPassed) {
          showToast(`⚠️ 打卡失敗：請連接指定公司 WiFi (${punchConfig.wifiName})！`, 'warning');
          return false;
        }

        if (isGpsOn && !gpsPassed) {
          showToast(`⚠️ 打卡失敗：您不在公司指定的 GPS 允許半徑範圍內！`, 'warning');
          return false;
        }

        return true;
      };

      const handleClockIn = async () => {
        if (!currentUser) return;
        
        const passRestrictions = await validatePunchRestrictions();
        if (!passRestrictions) return;

        const timeStr = currentTime.toTimeString().split(' ')[0];
        
        const lateMins = calculateLateMinutes(currentUser.shift, currentTime);
        const isLate = lateMins > 0;
        
        const newLog = {
          id: 'LOG' + Date.now(),
          empId: currentUser.id,
          date: todayStr,
          checkIn: timeStr,
          checkOut: '--:--:--',
          hours: 0,
          status: isLate ? 'late' : 'normal',
          lateMinutes: lateMins,
          note: punchNote || (isLate ? `遲到 ${lateMins} 分鐘` : '正常打卡')
        };

        setLogs(prev => [newLog, ...prev.filter(l => !(l.empId === currentUser.id && l.date === todayStr))]);
        setPunchNote('');
        showToast(`🎉 上班打卡成功！時間：${timeStr} (${isLate ? `遲到 ${lateMins} 分鐘` : '正常出勤'})`, isLate ? 'warning' : 'success');

        syncToGoogleSheet(newLog);

        if (window.confetti) {
          window.confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
        }
      };

      const handleClockOut = async () => {
        if (!currentUser || !todayLog) return;

        const passRestrictions = await validatePunchRestrictions();
        if (!passRestrictions) return;

        const timeStr = currentTime.toTimeString().split(' ')[0];

        let totalHours = 8.5;
        if (todayLog.checkIn && todayLog.checkIn !== '--:--:--') {
          const [h1, m1] = todayLog.checkIn.split(':').map(Number);
          const [h2, m2] = [currentTime.getHours(), currentTime.getMinutes()];
          const diffMinutes = (h2 * 60 + m2) - (h1 * 60 + m1) - 60;
          totalHours = Math.max(0, Number((diffMinutes / 60).toFixed(1)));
        }

        const updatedLog = {
          ...todayLog,
          checkOut: timeStr,
          hours: totalHours,
          note: punchNote ? `${todayLog.note} | ${punchNote}` : todayLog.note
        };

        setLogs(prev => prev.map(l => (l.empId === currentUser.id && l.date === todayStr) ? updatedLog : l));
        setPunchNote('');
        showToast(`👋 下班打卡成功！時間：${timeStr} (本日工作約 ${totalHours} 小時)`, 'success');

        syncToGoogleSheet(updatedLog);
      };

      const handleAddLeave = (leaveData) => {
        const newLeave = {
          id: 'LEV' + Date.now(),
          empId: currentUser.id,
          ...leaveData,
          status: 'pending',
          submitDate: todayStr
        };
        setLeaves(prev => [newLeave, ...prev]);
        setShowLeaveModal(false);
        showToast('📝 申請單已成功提交主管審核！');
      };

      const handleLeaveAudit = (id, newStatus) => {
        setLeaves(prev => prev.map(l => l.id === id ? { ...l, status: newStatus } : l));
        showToast(`審核完成：該單據已標記為 ${newStatus === 'approved' ? '核准' : '駁回'}`, newStatus === 'approved' ? 'success' : 'warning');
      };

      const handleExportReportCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        let fileName = "";

        if (reportType === 'monthly') {
          fileName = `全公司考勤月報表_${filterYear}年${filterMonth}月.csv`;
          csvContent += "打卡ID,員工編號,員工姓名,部門,班次,日期,上班時間,下班時間,總工時(小時),出勤狀態,遲到分鐘數,備註\n";
          
          const filteredLogs = logs.filter(l => l.date.startsWith(`${filterYear}-${filterMonth}`));
          filteredLogs.forEach(l => {
            const emp = employees.find(e => e.id === l.empId) || {};
            const statusText = l.status === 'normal' ? '正常出勤' : '遲到/異常';
            csvContent += `"${l.id}","${l.empId}","${emp.name || ''}","${emp.dept || ''}","${emp.shift || ''}","${cleanDateString(l.date)}","${cleanTimeString(l.checkIn)}","${cleanTimeString(l.checkOut)}","${l.hours}","${statusText}","${l.lateMinutes || 0}","${l.note || ''}"\n`;
          });

        } else if (reportType === 'yearly') {
          fileName = `全公司年度出勤統計總表_${filterYear}年.csv`;
          csvContent += "員工編號,員工姓名,部門,班次,年度,正常出勤天數,遲到天數/次數,當月總遲到(分鐘),累計工時(小時)\n";

          employees.forEach(emp => {
            const empYearLogs = logs.filter(l => l.empId === emp.id && l.date.startsWith(`${filterYear}-`));
            const normalDays = empYearLogs.filter(l => l.status === 'normal').length;
            const lateDays = empYearLogs.filter(l => l.status === 'late').length;
            const totalLateMins = empYearLogs.reduce((sum, l) => sum + (l.lateMinutes || 0), 0);
            const totalHours = empYearLogs.reduce((sum, l) => sum + (l.hours || 0), 0).toFixed(1);
            csvContent += `"${emp.id}","${emp.name}","${emp.dept}","${emp.shift || ''}","${filterYear}","${normalDays} 天","${lateDays} 次","${totalLateMins} 分鐘","${totalHours} 小時"\n`;
          });

        } else if (reportType === 'leave') {
          fileName = `全公司請假紀錄表_${filterYear}年.csv`;
          csvContent += "申請單號,員工編號,員工姓名,假別,開始日期,結束日期,請假時數,事由說明,審核狀態\n";

          leaves.filter(l => l.type !== '加班').forEach(l => {
            const emp = employees.find(e => e.id === l.empId) || {};
            const statusText = l.status === 'approved' ? '已核准' : l.status === 'pending' ? '待審核' : '已駁回';
            csvContent += `"${l.id}","${l.empId}","${emp.name || ''}","${l.type}","${cleanDateString(l.startDate)}","${cleanDateString(l.endDate)}","${l.hours}","${l.reason}","${statusText}"\n`;
          });

        } else if (reportType === 'overtime') {
          fileName = `全公司加班紀錄表_${filterYear}年.csv`;

                {/* Employee Roster Table with Shift Editing */}
                <div class="glass-card rounded-2xl p-6">
                  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                    <div>
                      <h3 class="text-base font-bold text-white">👨‍💼 員工名冊、工作班次與年假天數設定</h3>
                      <p class="text-xs text-slate-400 mt-0.5">
                        {gasUrl ? '💡 已連結 Google 試算表，您亦可直接在 Google 試算表「員工名冊與假額度」分頁中編輯班次，系統將自動同步！' : '您可在本區新增或修改員工資料、工作班次與特休額度'}
                      </p>
                    </div>
                    <div class="flex items-center space-x-2">
                      {gasUrl && (
                        <button 
                          onClick={fetchFromSheet}
                          disabled={syncingGas}
                          class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold border border-slate-700 flex items-center space-x-1"
                        >
                          <span>🔄 從試算表重新同步</span>
                        </button>
                      )}
                      <button 
                        onClick={() => {
                          setEditingEmp({
                            id: 'EMP' + String(employees.length + 1).padStart(3, '0'),
                            username: 'user' + (employees.length + 1),
                            pass: '123456',
                            name: '',
                            role: '專員',
                            dept: '技術研發部',
                            avatar: '👨‍💼',
                            shift: '09:00 - 18:00',
                            isAdmin: false,
                            annualLeave: 10,
                            sickLeave: 30,
                            compLeave: 0
                          });
                          setShowEmpEditModal(true);
                        }}
                        class="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold shadow-md flex items-center space-x-1"
                      >
                        <span>➕ 新增員工資料</span>
                      </button>
                    </div>
                  </div>

                  <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-300">
                      <thead class="bg-slate-900/80 text-xs uppercase text-slate-400 border-b border-slate-800">
                        <tr>
                          <th class="py-3 px-4">員工編號</th>
                          <th class="py-3 px-4">姓名</th>
                          <th class="py-3 px-4">部門</th>
                          <th class="py-3 px-4">職稱/職位</th>
                          <th class="py-3 px-4">工作班次</th>
                          <th class="py-3 px-4">登入帳號</th>
                          <th class="py-3 px-4">特休(天)</th>
                          <th class="py-3 px-4">權限</th>
                          <th class="py-3 px-4 text-right">操作</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-800/60">
                        {employees.map(emp => (
                          <tr key={emp.id} class="hover:bg-slate-800/30">
                            <td class="py-3 px-4 font-mono text-xs text-slate-400">{emp.id}</td>
                            <td class="py-3 px-4 font-bold text-white flex items-center space-x-2">
                              <span>{emp.avatar}</span>
                              <span>{emp.name}</span>
                            </td>
                            <td class="py-3 px-4 text-slate-300">{emp.dept}</td>
                            <td class="py-3 px-4 font-semibold text-blue-300">{emp.role}</td>
                            <td class="py-3 px-4 text-xs font-bold text-emerald-400 bg-emerald-950/40 px-2 py-1 rounded w-fit border border-emerald-500/20">
                              ⏱️ {emp.shift || '09:00 - 18:00'}
                            </td>
                            <td class="py-3 px-4 font-mono text-xs text-slate-400">{emp.username}</td>
                            <td class="py-3 px-4 font-bold text-emerald-400">{emp.annualLeave || 10} 天</td>
                            <td class="py-3 px-4">
                              <span class={`text-xs px-2 py-0.5 rounded ${emp.isAdmin ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30' : 'bg-slate-800 text-slate-400'}`}>
                                {emp.isAdmin ? '主管' : '員工'}
                              </span>
                            </td>
                            <td class="py-3 px-4 text-right">
                              <button 
                                onClick={() => {
                                  setEditingEmp(emp);
                                  setShowEmpEditModal(true);
                                }}
                                class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-blue-300 rounded-lg"
                              >
                                ✏️ 編輯員工/班次
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* Leave Approvals Section */}
                <div class="glass-card rounded-2xl p-6">
                  <h3 class="text-base font-bold text-white mb-4">待審核假單列表</h3>
                  {leaves.filter(l => l.status === 'pending').length === 0 ? (
                    <p class="text-xs text-slate-500 py-4 text-center">目前無待審核之假單</p>
                  ) : (
                    <div class="space-y-3">
                      {leaves.filter(l => l.status === 'pending').map(lev => {
                        const emp = employees.find(e => e.id === lev.empId) || {};
                        return (
                          <div key={lev.id} class="p-4 bg-slate-900/80 rounded-xl border border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div class="flex items-center space-x-3">
                              <span class="text-2xl">{emp.avatar}</span>
                              <div>
                                <h4 class="text-sm font-bold text-white">{emp.name} ({emp.dept})</h4>
                                <p class="text-xs text-slate-400">
                                  申請【{lev.type}】{cleanDateString(lev.startDate)} ~ {cleanDateString(lev.endDate)} ({lev.hours} 小時)
                                </p>
                                <p class="text-xs text-slate-500 mt-0.5">事由：{lev.reason}</p>
                              </div>
                            </div>
                            <div class="flex items-center space-x-2">
                              <button 
                                onClick={() => handleLeaveAudit(lev.id, 'approved')}
                                class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold"
                              >
                                批准
                              </button>
                              <button 
                                onClick={() => handleLeaveAudit(lev.id, 'rejected')}
                                class="px-3.5 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-xs font-semibold"
                              >
                                駁回
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>

              </div>
            )}

          </main>

          {/* --- Employee & Shift Edit Modal --- */}
          {showEmpEditModal && editingEmp && (
            <div class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="glass-card max-w-lg w-full rounded-2xl p-6 relative border border-slate-700 shadow-2xl">
                <h3 class="text-lg font-bold text-white mb-4">
                  {employees.some(e => e.id === editingEmp.id) ? '編輯員工、工作班次與年假資料' : '新增員工資料'}
                </h3>
                
                <form onSubmit={(e) => {
                  e.preventDefault();
                  handleSaveEmployee(editingEmp);
                }} class="space-y-4">

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-medium text-slate-400 mb-1">員工編號：</label>
                      <input 
                        type="text" 
                        value={editingEmp.id} 
                        onChange={(e) => setEditingEmp({ ...editingEmp, id: e.target.value })}
                        required 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200" 
                      />
                    </div>
                    <div>
                      <label class="block text-xs font-medium text-slate-400 mb-1">員工姓名：</label>
                      <input 
                        type="text" 
                        value={editingEmp.name} 
                        onChange={(e) => setEditingEmp({ ...editingEmp, name: e.target.value })}
                        required 
                        placeholder="請輸入姓名..."
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200" 
                      />
                    </div>
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-medium text-slate-400 mb-1">職稱 / 職位：</label>
                      <input 
                        type="text" 
                        value={editingEmp.role} 
                        onChange={(e) => setEditingEmp({ ...editingEmp, role: e.target.value })}
                        required 
                        placeholder="例如：高級工程師..."
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200" 
                      />
                    </div>
                    <div>
                      <label class="block text-xs font-medium text-slate-400 mb-1">部門：</label>
                      <input 
                        type="text" 
                        value={editingEmp.dept} 
                        onChange={(e) => setEditingEmp({ ...editingEmp, dept: e.target.value })}
                        required 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200" 
                      />
                    </div>
                  </div>

                  <div>
                    <label class="block text-xs font-medium text-emerald-400 mb-1">⏱️ 工作班次 (上下班時間)：</label>
                    <div class="grid grid-cols-2 gap-2">
                      <select 
                        value={['09:00 - 18:00', '09:30 - 18:30', '08:30 - 17:30', '10:00 - 19:00'].includes(editingEmp.shift) ? editingEmp.shift : 'custom'}
                        onChange={(e) => {
                          if (e.target.value !== 'custom') {
                            setEditingEmp({ ...editingEmp, shift: e.target.value });
                          }
                        }}
                        class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200"
                      >
                        <option value="09:00 - 18:00">標準班 A (09:00 - 18:00)</option>
                        <option value="09:30 - 18:30">標準班 B (09:30 - 18:30)</option>
                        <option value="08:30 - 17:30">早班 (08:30 - 17:30)</option>
                        <option value="10:00 - 19:00">晚班 (10:00 - 19:00)</option>
                        <option value="custom">自訂班次時間...</option>
                      </select>

                      <input 
                        type="text" 
                        value={editingEmp.shift || '09:00 - 18:00'} 
                        onChange={(e) => setEditingEmp({ ...editingEmp, shift: e.target.value })}
                        placeholder="例如: 09:00 - 18:00"
                        class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-emerald-400 font-bold font-mono" 
                      />
                    </div>
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-medium text-slate-400 mb-1">登入帳號：</label>
                      <input 
                        type="text" 
                        value={editingEmp.username} 
                        onChange={(e) => setEditingEmp({ ...editingEmp, username: e.target.value })}
                        required 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200" 
                      />
                    </div>
                    <div>
                      <label class="block text-xs font-medium text-slate-400 mb-1">登入密碼：</label>
                      <input 
                        type="text" 
                        value={editingEmp.pass} 
                        onChange={(e) => setEditingEmp({ ...editingEmp, pass: e.target.value })}
                        required 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 font-mono" 
                      />
                    </div>
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-medium text-slate-400 mb-1">特別休假/年假天數：</label>
                      <input 
                        type="number" 
                        value={editingEmp.annualLeave || 10} 
                        onChange={(e) => setEditingEmp({ ...editingEmp, annualLeave: Number(e.target.value) })}
                        required min="0" max="100"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-emerald-400 font-bold" 
                      />
                    </div>
                    <div>
                      <label class="block text-xs font-medium text-slate-400 mb-1">角色權限：</label>
                      <select 
                        value={editingEmp.isAdmin ? 'admin' : 'employee'}
                        onChange={(e) => setEditingEmp({ ...editingEmp, isAdmin: e.target.value === 'admin' })}
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200"
                      >
                        <option value="employee">一般員工</option>
                        <option value="admin">HR / 管理主管</option>
                      </select>
                    </div>
                  </div>

                  <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-800">
                    <button 
                      type="button" 
                      onClick={() => { setShowEmpEditModal(false); setEditingEmp(null); }}
                      class="px-4 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700 rounded-xl text-xs font-semibold"
                    >
                      取消
                    </button>
                    <button 
                      type="submit"
                      class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold"
                    >
                      儲存變更
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* --- Google Apps Script Settings Modal --- */}
          {showSettingsModal && currentUser.isAdmin && (
            <div class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="glass-card max-w-lg w-full rounded-2xl p-6 relative border border-slate-700 shadow-2xl">
                <h3 class="text-lg font-bold text-white mb-2">Google 試算表 (Apps Script) 同步設定</h3>
                <p class="text-xs text-slate-400 mb-4">
                  部署 <code class="text-blue-400 bg-slate-900 px-1 py-0.5 rounded">GoogleAppsScript.gs</code> 後，將獲得的 Web App URL 貼於下方即可啟動自動同步！
                </p>

                <div class="space-y-4">
                  <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Google Apps Script Web App URL：</label>
                    <input 
                      type="url" 
                      value={gasUrl}
                      onChange={(e) => setGasUrl(e.target.value)}
                      placeholder="https://script.google.com/macros/s/.../exec"
                      class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs font-mono text-blue-300 focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div class="p-3 bg-slate-900/80 rounded-xl border border-slate-800 text-xs text-slate-400 space-y-1">
                    <p class="font-semibold text-slate-300">💡 雙向同步說明：</p>
                    <p>1. 連線後，您在 Google 試算表中修改「考勤紀錄」或「員工名冊與假額度」，網頁端皆會跟著同步更新！</p>
                    <p>2. 部署時請務必將【誰有存取權】設定為【任何人】(Anyone)。</p>
                  </div>

                  <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-800">
                    <button 
                      onClick={() => setShowSettingsModal(false)}
                      class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold"
                    >
                      儲存設定
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* --- Leave Request Form Modal --- */}
          {showLeaveModal && (
            <div class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="glass-card max-w-lg w-full rounded-2xl p-6 relative border border-slate-700 shadow-2xl">
                <h3 class="text-lg font-bold text-white mb-4">填寫請假 / 加班申請單</h3>
                
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  handleAddLeave({
                    type: fd.get('type'),
                    startDate: fd.get('startDate'),
                    endDate: fd.get('endDate'),
                    hours: Number(fd.get('hours')) || 8,
                    reason: fd.get('reason')
                  });
                }} class="space-y-4">

                  <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">申請種類：</label>
                    <select name="type" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200">
                      <option value="特休">特別休假 (特休/年假)</option>
                      <option value="事假">事假</option>
                      <option value="病假">普通傷病假</option>
                      <option value="婚喪假">婚喪假</option>
                      <option value="加班">加班登記 (換補休)</option>
                    </select>
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-medium text-slate-400 mb-1">開始日期：</label>
                      <input type="date" name="startDate" required defaultValue={todayStr} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200" />
                    </div>
                    <div>
                      <label class="block text-xs font-medium text-slate-400 mb-1">結束日期：</label>
                      <input type="date" name="endDate" required defaultValue={todayStr} class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200" />
                    </div>
                  </div>

                  <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">總申請時數 (小時)：</label>
                    <input type="number" name="hours" defaultValue="8" min="1" max="80" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200" />
                  </div>

                  <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">事由 / 說明：</label>
                    <textarea name="reason" required rows="3" placeholder="請詳細寫明申請事由..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200"></textarea>
                  </div>

                  <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-800">
                    <button 
                      type="button" 
                      onClick={() => setShowLeaveModal(false)}
                      class="px-4 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700 rounded-xl text-xs font-semibold"
                    >
                      取消
                    </button>
                    <button 
                      type="submit"
                      class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold"
                    >
                      送出申請
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
