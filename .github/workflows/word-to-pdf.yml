name: Auto Convert Word to PDF

on:
  push:
    paths:
      - 'docs/**/*.doc'
      - 'docs/**/*.docx'
  workflow_dispatch:

jobs:
  convert_to_pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 取得您的檔案 (Checkout code)
        uses: actions/checkout@v3

      - name: 安裝轉檔軟體 (LibreOffice)
        run: sudo apt-get update && sudo apt-get install -y libreoffice

      - name: 執行 Word 轉 PDF (加入防卡死機制)
        run: |
          shopt -s globstar
          for file in docs/**/*.doc docs/**/*.docx; do
            if [ -f "$file" ]; then
              echo "========================================"
              echo "開始轉換：$file"
              dir=$(dirname "$file")
              # 設定 timeout 120s，每個檔案最多給 2 分鐘，超時就強制中斷並印出警告
              timeout 120s libreoffice --headless --convert-to pdf --outdir "$dir" "$file" || echo "⚠️ 轉換失敗或超時，已跳過此檔案：$file"
            fi
          done

      - name: 將轉好的 PDF 存回 GitHub (Commit and Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/**/*.pdf
          # 如果有產生新的 PDF 才進行存檔並推播
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動轉檔：Word 轉 PDF" && git push)
