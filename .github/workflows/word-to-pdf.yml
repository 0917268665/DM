name: Auto Convert Word to PDF

on:
  push:
    paths:
      - 'docs/**/*.doc'
      - 'docs/**/*.docx'
  workflow_dispatch:

jobs:
  convert_to_pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 取得您的檔案 (Checkout code)
        uses: actions/checkout@v3

      - name: 安裝轉檔軟體與中文字體
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-noto-cjk fonts-wqy-zenhei fonts-arphic-ukai fonts-arphic-uming
          fc-cache -fv

      - name: 執行 Word 轉 PDF (加入智慧跳過與防卡死機制)
        run: |
          shopt -s globstar
          for file in docs/**/*.doc docs/**/*.docx; do
            if [ -f "$file" ]; then
              # 找出對應的 PDF 檔名
              pdf_file="${file%.*}.pdf"
              
              # 判斷邏輯：如果 PDF 不存在 (! -f) 或者 Word 檔比 PDF 檔新 (-nt) 才轉檔
              if [ ! -f "$pdf_file" ] || [ "$file" -nt "$pdf_file" ]; then
                echo "========================================"
                echo "🆕 發現新檔案或有更新，開始轉換：$file"
                dir=$(dirname "$file")
                timeout 120s libreoffice --headless --convert-to pdf --outdir "$dir" "$file" || echo "⚠️ 轉換失敗或超時，已跳過此檔案：$file"
              else
                echo "⏭️ 無需更新，略過：$file"
              fi
            fi
          done

      - name: 將轉好的 PDF 存回 GitHub (Commit and Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add docs/
          
          if ! git diff --staged --quiet; then
            git commit -m "🤖 自動轉檔：更新 PDF 檔案"
            git push
          else
            echo "✅ 沒有產生新的 PDF 或檔案無變動，無須存檔。"
          fi
