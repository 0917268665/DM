name: Auto Convert Word to PDF

on:
  push:
    paths:
      - 'docs/**/*.doc'
      - 'docs/**/*.docx'
  workflow_dispatch:

jobs:
  convert_to_pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 取得您的檔案 (Checkout code)
        uses: actions/checkout@v3

      - name: 安裝轉檔軟體 (LibreOffice)
        run: sudo apt-get update && sudo apt-get install -y libreoffice

      - name: 執行 Word 轉 PDF (加入防卡死機制)
        run: |
          shopt -s globstar
          for file in docs/**/*.doc docs/**/*.docx; do
            if [ -f "$file" ]; then
              echo "========================================"
              echo "開始轉換：$file"
              dir=$(dirname "$file")
              # 設定 timeout 120s，每個檔案最多給 2 分鐘，超時就強制中斷
              timeout 120s libreoffice --headless --convert-to pdf --outdir "$dir" "$file" || echo "⚠️ 轉換失敗或超時，已跳過此檔案：$file"
            fi
          done

      - name: 將轉好的 PDF 存回 GitHub (Commit and Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 【關鍵修改】直接把整個 docs 資料夾加入，不使用容易報錯的星號
          git add docs/
          
          # 檢查是否有任何變更（是否有新的 PDF 產生），有才存檔，沒有就跳過
          if ! git diff --staged --quiet; then
            git commit -m "🤖 自動轉檔：Word 轉 PDF"
            git push
          else
            echo "✅ 沒有產生新的 PDF 或檔案無變動，無須存檔。"
          fi
