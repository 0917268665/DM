<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精選DM推薦</title>
    
    <meta property="og:title" content="世興DM 3D互動輪播專區">
    <meta property="og:description" content="由專屬業務陳彥百服務：提供最新旅遊行程 3D 動態輪播展示與官網連結。">
    <meta property="og:image" content="https://0917268665.github.io/DM/logo.png">
    <meta property="og:url" content="https://0917268665.github.io/DM/pai/Display/carousel.html">
    <meta property="og:type" content="website">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Swiper.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        :root {
            --primary-color: #f37021;
            --dark-bg: #121820;
            --card-glass: rgba(255, 255, 255, 0.08);
            --card-glass-hover: rgba(255, 255, 255, 0.15);
            --border-glass: rgba(255, 255, 255, 0.15);
            --border-glass-hover: rgba(255, 255, 255, 0.3);
            --text-light: #f8f9fa;
        }

        body {
            background-color: #121820; /* 改為單純深色背景，解決 iOS WebKit 漸變與平移動畫衝突崩潰的問題 */
            color: var(--text-light);
            font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 磨砂玻璃效果的 Header */
        .glass-header {
            background: rgba(18, 24, 32, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-logo {
            max-height: 45px;
            width: auto;
            object-fit: contain;
            background-color: white;
            padding: 5px 12px;
            border-radius: 8px;
        }

        /* 控制面板 */
        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: 50px;
            padding: 8px 24px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .custom-select {
            background-color: rgba(18, 24, 32, 0.8) !important;
            color: white !important;
            border: 1px solid var(--border-glass) !important;
            border-radius: 20px;
            padding: 5px 15px 5px 35px;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
        }
        
        .custom-select:focus {
            box-shadow: 0 0 0 0.25rem rgba(243, 112, 33, 0.25);
            border-color: var(--primary-color) !important;
        }

        .select-container {
            position: relative;
        }

        .select-container i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            pointer-events: none;
        }

        /* Swiper 容器樣式 - 拓寬左右寬度，採用自然高度 */
        .swiper-container-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px 0; /* 縮小上下邊距，釋放空間給卡片 */
            width: 98%; /* 寬度拉滿 98% */
            max-width: 1850px; /* 最大寬度提升至 1850px，完全消除電視左右空白 */
            margin: 0 auto;
        }

        .swiper {
            width: 100%;
            padding-top: 5px;
            padding-bottom: 30px;
        }

        /* 齒輪設定選單 */
        .settings-dropdown {
            position: relative;
        }
        
        .settings-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .settings-btn:hover, .settings-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            transform: rotate(45deg);
            box-shadow: 0 0 15px rgba(243, 112, 33, 0.4);
        }
        
        .settings-menu {
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 12px;
            background: rgba(18, 24, 32, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            display: none;
            z-index: 1100;
            width: 300px;
        }
        
        .settings-menu.show {
            display: block;
            animation: settingsFadeIn 0.25s ease-out;
        }
        
        @keyframes settingsFadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* DM 卡片樣式 - 放大最大寬度限制 */
        .dm-card {
            background: rgba(25, 32, 42, 0.95); /* 改用純色半透明背景，徹底移除 backdrop-filter，防止 iOS Safari/Chrome 在 Swiper 滑動動畫時因實時模糊計算導致 WebKit 崩潰 */
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            overflow: hidden;
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin: 0 auto;
            width: 100%;
            max-width: 500px; /* 最大寬度調整至 500px 以便在大螢幕上拉大圖片高度 */
            display: flex;
            flex-direction: column;
            will-change: transform; /* 提前告知瀏覽器變形，開啟硬體加速 */
            transform: translateZ(0); /* 啟用 iOS 3D 渲染合成層，防範滑動動畫時閃退 */
            -webkit-transform: translateZ(0);
        }

        /* 3D 懸停效果僅在非觸控裝置上生效 */
        @media (hover: hover) {
            .dm-card:hover {
                transform: translateY(-10px) scale(1.02);
                background: var(--card-glass-hover);
                border-color: var(--border-glass-hover);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            }
        }

        /* 圖片區域鎖定 A4 直向比例，防範拉伸變形 */
        .dm-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 210 / 297; /* 嚴格鎖定 A4 比例 */
            background-color: rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border-glass);
        }

        .dm-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.5s ease;
            will-change: transform;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
        }

        .dm-card:hover .dm-img {
            transform: scale(1.03);
        }

        /* 點擊數 Badge 貼紙 */
        .click-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(243, 112, 33, 0.95);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(4px);
        }

        .category-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(33, 150, 243, 0.9);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        /* 卡片文字與內邊距 */
        .card-info {
            padding: 15px 18px;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .dm-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: white;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.7rem;
        }

        .dm-meta {
            font-size: 0.8rem;
            color: #ffc107;
            margin-bottom: 8px;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .action-btn {
            background: linear-gradient(135deg, #f37021 0%, #ff8e42 100%);
            border: none;
            color: white;
            padding: 6px 15px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(243, 112, 33, 0.3);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 112, 33, 0.5);
            background: linear-gradient(135deg, #ff8e42 0%, #f37021 100%);
        }

        /* Swiper 導覽按鈕美化 */
        .swiper-button-next, .swiper-button-prev {
            color: var(--primary-color) !important;
            background: rgba(255, 255, 255, 0.05);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .swiper-button-next:after, .swiper-button-prev:after {
            font-size: 1.25rem !important;
            font-weight: bold;
        }

        .swiper-button-next:hover, .swiper-button-prev:hover {
            background: rgba(243, 112, 33, 0.2);
            border-color: var(--primary-color);
            transform: scale(1.05);
        }

        .swiper-pagination-bullet {
            background: rgba(255, 255, 255, 0.3) !important;
            width: 10px;
            height: 10px;
            transition: all 0.3s ease;
        }

        .swiper-pagination-bullet-active {
            background: var(--primary-color) !important;
            width: 24px;
            border-radius: 5px;
        }

        /* 頁尾資訊 */
        footer {
            background: rgba(18, 24, 32, 0.9);
            border-top: 1px solid var(--border-glass);
            padding: 20px 0;
            font-size: 0.85rem;
            color: #8c9ba5;
        }

        /* 載入中動畫 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 響應式佈局：大螢幕下使用 Grid 控制 Logo 左側兩行，標題與業務右側排列 */
        @media (min-width: 768px) {
            .header-left-wrapper {
                display: grid !important;
                grid-template-columns: auto 1fr;
                grid-template-rows: auto auto;
                align-items: center;
                column-gap: 20px;
                row-gap: 4px;
            }
            .header-logo {
                grid-column: 1;
                grid-row: 1 / span 2; /* Logo 佔用左側高度 */
            }
            .header-title-area {
                grid-column: 2;
                grid-row: 1;
            }
            .header-business-info {
                grid-column: 2;
                grid-row: 2;
                margin-top: 0 !important;
            }
        }

        /* 橫向與直向螢幕自適應修正 - 手機版使用 Grid 將業務定位於 Logo 正下方 */
        @media (max-width: 767.98px) {
            .glass-header {
                padding: 6px 0 !important;
                position: relative; /* 確保齒輪絕對定位基準 */
            }
            .glass-header .header-logo {
                max-height: 30px; /* 縮小 Logo */
                padding: 2px 6px;
            }
            .header-left-wrapper {
                display: grid !important;
                grid-template-columns: auto 1fr;
                grid-template-rows: auto auto;
                align-items: center;
                column-gap: 10px;
                row-gap: 2px;
                width: calc(100% - 40px); /* 留出空間給右上角齒輪 */
            }
            .header-logo {
                grid-column: 1;
                grid-row: 1;
            }
            .header-business-info {
                grid-column: 1;
                grid-row: 2; /* 業務資訊在手機版排在 Logo 下方 */
                font-size: 0.62rem !important; /* 極致壓縮業務聯絡資訊 */
                margin-top: 1px !important;
                gap: 4px !important;
                white-space: nowrap; /* 強制單行不折行 */
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 140px; /* 限制寬度防止溢出 */
            }
            .header-title-area {
                grid-column: 2;
                grid-row: 1 / span 2; /* 右側標題與加 LINE 佔用右側高度 */
                border-left: none !important; /* 手機端拔除左邊框節省像素 */
                padding-left: 0 !important;
            }
            .glass-header h5 {
                font-size: 0.92rem !important; /* 縮小標題字體 */
            }
            .settings-dropdown {
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                z-index: 1010;
            }
            .settings-btn {
                width: 32px; /* 縮小齒輪按鈕，精緻且省空間 */
                height: 32px;
            }
            .settings-menu {
                right: 0;
                top: 100%;
                margin-top: 8px;
                width: 280px;
                padding: 15px;
            }
            .swiper-container-wrapper {
                width: 100%;
                padding: 10px 0;
            }
            .swiper-button-next, .swiper-button-prev {
                display: none !important; /* 手機版隱藏左右箭頭，直接手勢滑動 */
            }
            .dm-card {
                max-width: 320px !important; /* 手機版進一步限制卡片寬度，將解碼顯存開銷降低 60% */
            }
        }
    </style>
</head>
<body>

    <!-- 載入中遮罩 -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <h5>正在抓取最新 DM 行程...</h5>
    </div>

    <!-- Header 區塊 -->
    <header class="glass-header shadow-lg py-2">
        <div class="container-fluid px-4 d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
            <div class="d-flex align-items-center gap-3 flex-wrap header-left-wrapper">
                <!-- 1. Logo 圖片 -->
                <img src="../logo.png" alt="世興旅行社 Logo" class="header-logo" onerror="this.src='https://0917268665.github.io/DM/logo.png'">
                
                <!-- 2. 標題與加 LINE 按鈕 -->
                <div class="border-start border-secondary ps-3 header-title-area">
                    <div class="d-flex align-items-center gap-2 flex-nowrap">
                        <h5 class="mb-0 fw-bold text-white text-nowrap">精選DM推薦</h5>
                        <a href="https://line.me/ti/p/I_O5--_4ks" target="_blank" class="btn btn-success btn-xs rounded-pill px-2 py-0 text-white text-decoration-none d-flex align-items-center gap-1" style="font-size: 0.72rem; line-height: 1.5; height: fit-content; white-space: nowrap;">
                            <i class="fa-brands fa-line"></i>加 LINE
                        </a>
                    </div>
                </div>
                
                <!-- 3. 業務聯絡資訊 (由 CSS Grid 控制其在手機版排在 Logo 下方，電腦版排在標題下方) -->
                <div class="header-business-info mt-1 d-flex align-items-center gap-2 flex-wrap" style="font-size: 0.82rem; color: #a0b0c0;">
                    <span><i class="fa-solid fa-user text-warning me-1"></i>陳彥百 (百百)</span>
                    <span class="d-none d-md-inline">|</span>
                    <span><i class="fa-solid fa-phone text-warning me-1"></i>0917268665</span>
                    <span class="d-none d-md-inline">|</span>
                    <span>ID: LAES62</span>
                </div>
            </div>
            
            <!-- 齒輪設定按鈕與下拉面板 -->
            <div class="settings-dropdown">
                <button id="settings-toggle-btn" class="settings-btn" onclick="toggleSettingsMenu()" title="設定選項">
                    <i class="fa-solid fa-gear fa-lg"></i>
                </button>
                <div id="settings-menu" class="settings-menu shadow-lg">
                    <h6 class="text-warning mb-3 fw-bold"><i class="fa-solid fa-sliders me-2"></i>輪播與篩選設定</h6>
                    
                    <!-- 1. 輪播特效 -->
                    <div class="mb-3 text-start">
                        <label class="form-label text-muted small mb-1">輪播特效</label>
                        <div class="select-container">
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                            <select class="form-select custom-select w-100" id="effect-select" onchange="changeEffect(this.value)">
                                <option value="coverflow">3D 覆蓋流 (推薦)</option>
                                <option value="slide" selected>經典左右滑動</option>
                                <option value="fade">極簡淡入淡出</option>
                                <option value="flip">3D 卡片翻轉</option>
                            </select>
                        </div>
                        <small class="text-muted d-block mt-1" style="font-size: 0.7rem; line-height: 1.3;">* 行動裝置將自動優化為左右滑動以防崩潰</small>
                    </div>
                    
                    <!-- 2. 國家篩選 -->
                    <div class="mb-3 text-start">
                        <label class="form-label text-muted small mb-1">國家篩選</label>
                        <div class="select-container">
                            <i class="fa-solid fa-earth-asia"></i>
                            <select class="form-select custom-select w-100" id="category-select" onchange="changeCategory(this.value)">
                                <option value="all" selected>全部國家</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- 3. 播放模式 -->
                    <div class="mb-2 text-start">
                        <label class="form-label text-muted small mb-1">播放模式</label>
                        <button id="sort-toggle-btn" class="btn btn-warning text-dark rounded-pill w-100 btn-sm d-flex align-items-center justify-content-center gap-2" onclick="toggleSortOrder()">
                            <i class="fa-solid fa-shuffle"></i> 隨機播放
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 輪播主區塊 -->
    <div class="swiper-container-wrapper container">
        <div class="swiper">
            <div class="swiper-wrapper" id="carousel-wrapper">
                <!-- 資料動態生成 -->
            </div>
            
            <!-- 分頁點 (Dots) -->
            <div class="swiper-pagination"></div>
            
            <!-- 導覽按鈕 (Arrows) -->
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
        </div>
    </div>

    <!-- 頁尾 - 移除重複的業務大字資訊以釋放高度空間 -->
    <footer class="text-center py-2">
        <div class="container">
            <small class="d-block" style="color: #cbd5e1; font-size: 0.8rem;">本網頁內容僅供同業與客戶參考，詳情請以業務正式回覆為準。版權所有 © 新魅力旅遊</small>
        </div>
    </footer>

    <!-- JS 庫引入 (改用高穩定的 cdnjs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        // ==========================================
        // 設定區
        // ==========================================
        const googleSheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcPCobeix2WBU69fxSbx9IKFJpPtP04dutrcHp-KV8L1vnAEcUErx-x0zfGbBBYaUWtzgR-ZZR6W6B/pub?output=csv";
        
        // 請在此填入您的 Google Apps Script 部署網址以啟動全域點擊統計
        // 格式如：https://script.google.com/macros/s/AKfycbz.../exec
        const gasApiUrl = ""; 

        let ALL_TOURS = [];
        let ORIGINAL_TOURS = []; // 儲存原始行程順序的備份
        let DISPLAY_TOURS = [];  // 當前已套用國家篩選並要顯示的行程資料
        let CLICKS_MAP = {};
        let swiperInstance = null;
        let currentEffect = 'slide'; // 預設改為經典左右滑動
        let isShuffle = true; // 預設開啟隨機模式
        let currentCategory = 'all'; // 當前選取的國家分類

        // 帶有超時控制的 fetch 輔助函式，防止手機瀏覽器因跨網域請求掛起而一直轉圈圈
        function fetchWithTimeout(resource, options = {}) {
            const { timeout = 5000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            return fetch(resource, {
                ...options,
                signal: controller.signal
            }).then(response => {
                clearTimeout(id);
                return response;
            }).catch(error => {
                clearTimeout(id);
                throw error;
            });
        }

        // 頁面載入完成
        document.addEventListener("DOMContentLoaded", function() {
            // 如果為手機版，預設將特效設為 slide，並更新下拉選單顯示值以防 3D 渲染記憶體崩潰
            if (window.innerWidth < 768) {
                currentEffect = 'slide';
                const select = document.getElementById('effect-select');
                if (select) select.value = 'slide';
            }
            initApp();
        });

        // 初始化應用程式
        async function initApp() {
            try {
                // 1. 抓取全域點擊次數 (若有設定 API)
                await fetchGlobalClicks();
                // 2. 抓取行程 CSV
                await fetchSheetData();
            } catch (error) {
                console.error("初始化失敗:", error);
                document.getElementById('loading-overlay').innerHTML = `
                    <div class="container text-center text-white py-5">
                        <i class="fa-solid fa-triangle-exclamation fa-3x text-danger mb-3"></i>
                        <h4>載入行程資料時發生錯誤</h4>
                        <p class="text-muted">${error.message}</p>
                        <button class="btn btn-warning rounded-pill mt-3" onclick="location.reload()">重新整理</button>
                    </div>
                `;
            }
        }

        // 讀取全域點擊數
        async function fetchGlobalClicks() {
            if (!gasApiUrl) {
                // 若無設定 API，從 localStorage 抓取本地紀錄作為替代 (防範手機無痕模式禁用)
                try {
                    const localClicks = localStorage.getItem('dm_clicks_fallback');
                    if (localClicks) {
                        CLICKS_MAP = JSON.parse(localClicks);
                    }
                } catch(e) {
                    console.warn("LocalStorage 遭瀏覽器停用:", e);
                }
                return;
            }

            try {
                // 加上 timestamp 防止快取，並限制 5 秒超時以防無限轉圈圈
                const response = await fetchWithTimeout(`${gasApiUrl}?action=getAll&t=${new Date().getTime()}`, { timeout: 5000 });
                if (response.ok) {
                    const json = await response.json();
                    if (json.status === "success" && json.data) {
                        CLICKS_MAP = json.data;
                    }
                }
            } catch (err) {
                console.warn("無法取得伺服器點擊統計，將降級為本地紀錄:", err);
                // 降級載入本地紀錄 (防範手機無痕模式禁用)
                try {
                    const localClicks = localStorage.getItem('dm_clicks_fallback');
                    if (localClicks) {
                        CLICKS_MAP = JSON.parse(localClicks);
                    }
                } catch(e) {
                    console.warn("LocalStorage 遭瀏覽器停用:", e);
                }
            }
        }

        // 抓取 Google 試算表 CSV
        function fetchSheetData() {
            return new Promise((resolve, reject) => {
                // 限制 Google Sheet 載入最長 10 秒，逾時自動中斷防卡死
                fetchWithTimeout(googleSheetUrl, { timeout: 10000 })
                    .then(response => {
                        if (!response.ok) throw new Error("Google Sheet 網路回應異常");
                        return response.text();
                    })
                    .then(csvText => {
                        Papa.parse(csvText, {
                            header: true,
                            skipEmptyLines: true,
                            complete: function(results) {
                                // 清洗資料，去除欄位名與數值尾部的 \r 換行符以防 DOM 損壞
                                const cleanData = results.data.map(item => {
                                    const cleanItem = {};
                                    for (let key in item) {
                                        const cleanKey = key.replace(/\r/g, '').trim();
                                        const cleanVal = typeof item[key] === 'string' ? item[key].replace(/\r/g, '').trim() : item[key];
                                        cleanItem[cleanKey] = cleanVal;
                                    }
                                    return cleanItem;
                                });

                                // 過濾掉沒有 id 或標題的無效列
                                ALL_TOURS = cleanData.filter(item => item.id && item.title);
                                ORIGINAL_TOURS = [...ALL_TOURS]; // 備份原始行程
                                
                                // 預設為隨機播放，所以在初始化時直接對 ALL_TOURS 進行隨機打亂
                                ALL_TOURS = shuffleArray([...ORIGINAL_TOURS]);
                                DISPLAY_TOURS = [...ALL_TOURS]; // 初始化為篩選來源

                                if (ALL_TOURS.length === 0) {
                                    reject(new Error("試算表內沒有有效的行程資料。"));
                                    return;
                                }

                                try {
                                    buildCategorySelect(); // 動態建立分類下拉選單
                                    renderCarousel();
                                    hideLoading();
                                    resolve();
                                } catch (renderError) {
                                    console.error("輪播渲染失敗:", renderError);
                                    hideLoading(); // 確保遮罩不卡死
                                    reject(new Error("輪播元件初始化異常，請重試：" + renderError.message));
                                }
                            },
                            error: function(err) {
                                reject(new Error("CSV 解析失敗: " + err.message));
                            }
                        });
                    })
                    .catch(err => {
                        reject(err);
                    });
            });
        }

        // 隱藏載入中遮罩
        function hideLoading() {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) {
                overlay.style.opacity = 0;
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 500);
            }
        }

        // 輔助：轉換 Google Drive 圖片連結與 resizing
        function convertToDirectLink(url, isImage = false) {
            if (!url) return "#";
            if (url.startsWith("http") && url.includes("drive.google.com")) {
                const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return isImage 
                        ? `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800`
                        : `https://docs.google.com/uc?export=download&id=${match[1]}`;
                }
            }
            return url; 
        }

        function getResizedPath(originalPath, size) {
            if (!originalPath || originalPath.startsWith("http")) return convertToDirectLink(originalPath, true);
            
            // 自動修正路徑：如果當前頁面位於 Display 目錄下，且圖片路徑以 ../ 開頭
            let fixedPath = originalPath;
            if (window.location.pathname.includes('/Display/') && fixedPath.startsWith('../')) {
                fixedPath = '../' + fixedPath; // 將 ../ 變為 ../../ 以退回兩層
            }
            
            if (size === 'original') return fixedPath;
            if (fixedPath.toLowerCase().endsWith(".jpg")) {
                return fixedPath.replace(/.jpg$/i, "_m.jpg");
            }
            if (fixedPath.toLowerCase().endsWith(".png")) {
                return fixedPath.replace(/.png$/i, "_m.png");
            }
            return fixedPath;
        }

        // 渲染輪播 HTML
        function renderCarousel() {
            const wrapper = document.getElementById('carousel-wrapper');
            wrapper.innerHTML = "";

            if (DISPLAY_TOURS.length === 0) {
                wrapper.innerHTML = `
                    <div class="swiper-slide text-center text-white py-5">
                        <i class="fa-solid fa-folder-open fa-3x mb-3 text-warning"></i>
                        <h5>此分類下暫無任何行程 DM</h5>
                    </div>
                `;
                buildSwiper(currentEffect);
                return;
            }

            DISPLAY_TOURS.forEach((tour) => {
                // 優先使用 preview 大小，以便輪播畫質清晰且不會太慢
                const imgSrc = getResizedPath(tour.img, 'preview');
                const originalSrc = getResizedPath(tour.img, 'original');
                const clicks = CLICKS_MAP[tour.id] || 0;
                
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                
                // 建立卡片 HTML (加上 onerror 圖片載入自癒機制，若縮圖不存在自動加載原圖，解決 WebKit 動畫渲染無效節點閃退問題)
                slide.innerHTML = `
                    <div class="dm-card" onclick="handleCardClick('${tour.id}', '${tour.title.replace(/'/g, "\\'")}', '${tour.company_prod_no}')">
                        <div class="dm-image-wrapper">
                            <img src="${imgSrc}" class="dm-img" alt="${tour.title}" onerror="this.onerror=null; this.src='${originalSrc}';">
                        </div>
                        <div class="card-info">
                            <div class="dm-title">${tour.title}</div>
                            <div class="dm-meta">
                                <span><i class="fa-solid fa-hashtag me-1"></i>${tour.id}</span>
                                ${tour.remark ? ` | <span class="ms-1">${tour.remark}</span>` : ''}
                                <span id="badge-${tour.id}" style="display:none;"></span>
                            </div>
                            <button class="action-btn mt-3">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i> 前往行程網頁
                            </button>
                        </div>
                    </div>
                `;
                
                wrapper.appendChild(slide);
            });

            // 初始化 Swiper 實例
            buildSwiper(currentEffect);
        }

        // 建立或重置 Swiper
        function buildSwiper(effectName) {
            if (typeof Swiper === 'undefined') {
                throw new Error("Swiper 核心庫尚未載入完成");
            }

            if (swiperInstance) {
                swiperInstance.destroy(true, true);
            }

            // 判定是否為手機設備，手機版強迫改用經典的平面 slide 特效，避免 iOS Safari 3D 記憶體崩潰
            const isMobile = window.innerWidth < 768;
            const activeEffect = isMobile ? 'slide' : effectName;

            // 特效適配：Slide & Coverflow 可在大螢幕下多卡並列
            const isMulti = ['slide', 'coverflow'].includes(activeEffect);
            // 動態判斷 Loop 安全性：Slide 數量少於滑動行數的兩倍時，開啟 loop 會崩潰
            // 手機版一律強行關閉 loop 特效，避免 iOS 複製與切換 DOM 時發生崩潰
            const requiredSlides = isMulti ? 6 : 2;
            const canLoop = isMobile ? false : (ALL_TOURS.length >= requiredSlides);

            const swiperConfig = {
                effect: activeEffect,
                grabCursor: true,
                centeredSlides: true,
                loop: canLoop,
                speed: 800, // 將切換動畫速度放慢至 800ms，讓位移更平滑，避開 iOS WebKit 計算卡頓
                autoplay: { // 全面啟用自動播放，因為背景與點點已優化，手機與 iPad 皆能安全穩定輪播
                    delay: 4000,
                    disableOnInteraction: false,
                    pauseOnMouseEnter: true,
                },
                pagination: {
                    el: '.swiper-pagination',
                    clickable: true,
                    type: 'fraction', // 改為分式顯示（例如：3 / 15），精美省空間且防止 iOS 換頁時高頻重繪點點導致崩潰
                },
                navigation: {
                    nextEl: '.swiper-button-next',
                    prevEl: '.swiper-button-prev',
                }
            };

            if (isMulti) {
                swiperConfig.breakpoints = {
                    320: {
                        slidesPerView: 1,
                        spaceBetween: 15
                    },
                    768: {
                        slidesPerView: 3,
                        spaceBetween: 20 /* 間距從 30 縮減至 20，讓卡片更緊湊，留白更少 */
                    }
                };

                if (activeEffect === 'coverflow') {
                    swiperConfig.coverflowEffect = {
                        rotate: 15,
                        stretch: 0,
                        depth: 120,
                        modifier: 1.3,
                        slideShadows: true,
                    };
                }
            } else {
                // Fade / Flip 在 Swiper 規定下一次只適合展示 1 張，否則會重疊跑版
                swiperConfig.slidesPerView = 1;
                swiperConfig.spaceBetween = 0;

                if (activeEffect === 'fade') {
                    swiperConfig.fadeEffect = {
                        crossFade: true
                    };
                } else if (activeEffect === 'flip') {
                    swiperConfig.flipEffect = {
                        slideShadows: true,
                        limitRotation: true
                    };
                }
            }

            swiperInstance = new Swiper('.swiper', swiperConfig);
        }

        // 切換輪播特效
        function changeEffect(val) {
            currentEffect = val;
            buildSwiper(val);
        }

        // 卡片點擊事件處理（計數並跳轉）
        function handleCardClick(prodId, title, prodNo) {
            // 1. 觸發點擊記錄
            trackClickEvent(prodId, title);

            // 2. 官網跳轉
            if (prodNo) {
                const officialUrl = `https://www.newamazing.com.tw/EW/GO/MGroupDetail.asp?prodCd=${prodNo}`;
                window.open(officialUrl, '_blank');
            } else {
                alert("此行程暫無官網詳細頁面連結。");
            }
        }

        // 異步發送計數請求給 GAS 或本地存儲
        function trackClickEvent(prodId, title) {
            // 優先更新前端介面（讓使用者點擊時有即時回饋，不需要等網路回傳）
            const badge = document.getElementById(`badge-${prodId}`);
            if (badge) {
                const currentCount = CLICKS_MAP[prodId] || 0;
                const newCount = currentCount + 1;
                CLICKS_MAP[prodId] = newCount;
                badge.innerHTML = `<i class="fa-solid fa-fire text-warning"></i> 關注 ${newCount} 次`;
            }

            // 更新 LocalStorage Fallback 
            try {
                const fallbackClicks = localStorage.getItem('dm_clicks_fallback') || "{}";
                const fallbackMap = JSON.parse(fallbackClicks);
                fallbackMap[prodId] = (fallbackMap[prodId] || 0) + 1;
                localStorage.setItem('dm_clicks_fallback', JSON.stringify(fallbackMap));
            } catch(e) {
                console.error("LocalStorage 更新失敗", e);
            }

            // 如果有設定 GAS API，發送請求到後端 Google 試算表
            if (gasApiUrl) {
                const apiUrl = `${gasApiUrl}?prod_id=${encodeURIComponent(prodId)}&title=${encodeURIComponent(title)}&t=${new Date().getTime()}`;
                
                // 使用 fetch 進行背景非同步傳送
                fetch(apiUrl, { mode: 'no-cors' })
                    .then(() => {
                        console.log(`GAS: 已成功紀錄點擊 - ${prodId}`);
                    })
                    .catch(err => {
                        console.warn("GAS API 連線失敗:", err);
                    });
            }
        }

        // 新增：動態填充國家分類選單
        function buildCategorySelect() {
            const select = document.getElementById('category-select');
            if (!select) return;

            // 收集所有不重複的國家分類
            const categories = new Set();
            ORIGINAL_TOURS.forEach(tour => {
                if (tour.category) {
                    // 若分類包含逗號或頓號，視情況可切分，此處以 Excel 為準
                    categories.add(tour.category.trim());
                }
            });

            // 清空並重設
            select.innerHTML = '<option value="all" selected>全部國家</option>';

            // 排序後加入選項
            Array.from(categories).sort().forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        // 新增：切換國家分類選單
        function changeCategory(val) {
            currentCategory = val;
            applyFilters();
        }

        // 新增：套用國家篩選邏輯
        function applyFilters() {
            if (currentCategory === 'all') {
                DISPLAY_TOURS = [...ALL_TOURS];
            } else {
                DISPLAY_TOURS = ALL_TOURS.filter(tour => tour.category && tour.category.includes(currentCategory));
            }

            // 重新渲染輪播
            renderCarousel();
        }

        // 新增：切換順序/隨機播放邏輯
        function toggleSortOrder() {
            const btn = document.getElementById('sort-toggle-btn');
            isShuffle = !isShuffle;

            if (isShuffle) {
                // 隨機播放：打亂原始備份陣列
                ALL_TOURS = shuffleArray([...ORIGINAL_TOURS]);
                btn.innerHTML = `<i class="fa-solid fa-shuffle me-1"></i>隨機播放`;
                btn.classList.replace('btn-outline-light', 'btn-warning');
                btn.classList.add('text-dark');
            } else {
                // 順序播放：還原原始備份陣列
                ALL_TOURS = [...ORIGINAL_TOURS];
                btn.innerHTML = `<i class="fa-solid fa-arrow-down-1-9 me-1"></i>順序播放`;
                btn.classList.replace('btn-warning', 'btn-outline-light');
                btn.classList.remove('text-dark');
            }

            // 套用分類篩選並重新渲染
            applyFilters();
        }

        // 經典 Fisher-Yates 隨機打亂演算法
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 新增：切換設定選單顯示/隱藏
        function toggleSettingsMenu() {
            const menu = document.getElementById('settings-menu');
            const btn = document.getElementById('settings-toggle-btn');
            if (menu && btn) {
                menu.classList.toggle('show');
                btn.classList.toggle('active');
            }
        }

        // 新增：點擊面板外部時，自動隱藏選單
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('settings-menu');
            const btn = document.getElementById('settings-toggle-btn');
            if (menu && btn && menu.classList.contains('show')) {
                if (!menu.contains(event.target) && !btn.contains(event.target)) {
                    menu.classList.remove('show');
                    btn.classList.remove('active');
                }
            }
        });
    </script>
</body>
